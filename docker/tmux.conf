# =============================================================================
#  .tmux.conf - cau hinh tmux cho phien Claude Code chay ben trong container
#
#  MUC DICH: phien "claude" chay trong tmux SONG SOT khi ban dong tab trinh
#  duyet / mat mang / chuyen app tren dien thoai. Terminal cua code-server chi
#  la mot cua so xem vao tmux, dong no khong giet tien trinh ben trong.
# =============================================================================

# Bat mouse: cham/keo bang ngon tay tren dien thoai cuon duoc scrollback, chon
# pane, keo chinh kich thuoc. RAT quan trong khi dung tren dien thoai (khong co
# phim PageUp).
set -g mouse on

# Scrollback lon: giu 50000 dong lich su de doc lai output dai cua claude
# (build log, ket qua test...) ma khong bi troi mat.
set -g history-limit 50000

# Bao tmux terminal ho tro 256 mau - claude/vim/htop hien mau dung.
set -g default-terminal "screen-256color"

# escape-time thap: tranh do tre khi go phim Esc (vim, claude bat phim ngay).
set -sg escape-time 10

# Danh so cua so / pane tu 1 cho de bam (ban phim so bat dau tu 1).
set -g base-index 1
setw -g pane-base-index 1

# Tang gioi han tin nhan hien tren status va thoi gian hien thi lau hon.
set -g display-time 2000

# --- Thanh trang thai (status bar) -------------------------------------------
# Bat status de luon thay minh dang o phien nao, gio may chu, ten cua so.
set -g status on
set -g status-interval 5
set -g status-style "bg=colour24,fg=colour231"
set -g status-left "#[bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour231]%Y-%m-%d %H:%M "
set -g status-right-length 40
setw -g window-status-current-style "bg=colour231,fg=colour24,bold"
